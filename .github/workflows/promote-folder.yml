name: Promote Folder from Soruce to Target

on:
  workflow_dispatch:
    inputs:
      folder-id:
        description: "UUID of the folder to export from Soruce"
        required: true
        default: "REPLACE_WITH_YOUR_FOLDER_UUID"

jobs:
  export:
    runs-on: ubuntu-latest
    environment: SOURCE
    outputs:
      task-id:     ${{ steps.export.outputs.task-id }}
      status:      ${{ steps.export.outputs.status }}
      bundle-path: ${{ steps.export.outputs.bundle-path }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Export folder from Soruce environment
        id: export
        uses: icedq-tools/export-action@main
        with:
          icedq-url:       ${{ vars.ICEDQ_URL }}
          keycloak-url:    ${{ vars.ICEDQ_KEYCLOAK_URL }}
          org-id:          ${{ vars.ICEDQ_ORG_ID }}
          client-id:       ${{ secrets.ICEDQ_CLIENT_ID }}
          client-secret:   ${{ secrets.ICEDQ_CLIENT_SECRET }}
          account-id:      ${{ vars.ICEDQ_ACCOUNT_ID }}
          workspace-id:    ${{ vars.ICEDQ_WORKSPACE_ID }}
          resource:        folder
          id:              ${{ inputs.folder-id }}
          include-child:   true
          output-file:     ./exports/bundle.zip
          artifact-name:   icedq-folder-bundle
          verify-ssl:      ${{ vars.ICEDQ_VERIFY_SSL }}

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: icedq-folder-bundle
          path: ./exports/bundle.zip

  generate-mapping:
    runs-on: ubuntu-latest
    needs: export
    environment: TARGET
    outputs:
      mapping-file: ${{ steps.generate.outputs.mapping-file }}
    steps:
      - name: Download bundle from export job
        uses: actions/download-artifact@v4
        with:
          name: icedq-folder-bundle
          path: ./exports

      - name: Generate mapping for Target environment
        id: generate
        uses: icedq-tools/generate-mapping-action@main
        with:
          icedq-url:      ${{ vars.ICEDQ_URL }}
          keycloak-url:   ${{ vars.ICEDQ_KEYCLOAK_URL }}
          org-id:         ${{ vars.ICEDQ_ORG_ID }}
          client-id:      ${{ secrets.ICEDQ_CLIENT_ID }}
          client-secret:  ${{ secrets.ICEDQ_CLIENT_SECRET }}
          account-id:     ${{ vars.ICEDQ_ACCOUNT_ID }}
          workspace-id:   ${{ vars.ICEDQ_WORKSPACE_ID }}
          bundle:         ./exports/bundle.zip
          output-file:    ./mapping/folder-migration-mapping.json
          upload-artifact: 'false'
          verify-ssl:     ${{ vars.ICEDQ_VERIFY_SSL }}

      - name: Upload mapping
        uses: actions/upload-artifact@v4
        with:
          name: icedq-folder-mapping
          path: ./mapping/folder-migration-mapping.json

  import:
    runs-on: ubuntu-latest
    needs: [export, generate-mapping]
    environment: TARGET
    steps:
      - name: Download bundle from export job
        uses: actions/download-artifact@v4
        with:
          name: icedq-folder-bundle
          path: ./exports

      - name: Download generated mapping
        uses: actions/download-artifact@v4
        with:
          name: icedq-folder-mapping
          path: ./mapping

      - name: Import folder into Target environment
        uses: icedq-tools/import-action@main
        with:
          icedq-url:             ${{ vars.ICEDQ_URL }}
          keycloak-url:          ${{ vars.ICEDQ_KEYCLOAK_URL }}
          org-id:                ${{ vars.ICEDQ_ORG_ID }}
          client-id:             ${{ secrets.ICEDQ_CLIENT_ID }}
          client-secret:         ${{ secrets.ICEDQ_CLIENT_SECRET }}
          account-id:            ${{ vars.ICEDQ_ACCOUNT_ID }}
          workspace-id:          ${{ vars.ICEDQ_WORKSPACE_ID }}
          bundle:                ./exports/bundle.zip
          kind:                  workflows
          mapping-file:          ./mapping/folder-migration-mapping.json
          strict:                false
          terminate-on-conflict: true
          verify-ssl:            ${{ vars.ICEDQ_VERIFY_SSL }}
