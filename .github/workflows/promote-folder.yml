name: Promote Folder from Source to Target

on:
  workflow_dispatch:
    inputs:
      folder-id:
        description: "UUID of the folder to export from Source"
        required: true
        default: "REPLACE_WITH_YOUR_FOLDER_UUID"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  export-folder:
    runs-on: ubuntu-latest
    environment: SOURCE
    timeout-minutes: 45
    steps:
      - name: Export folder from Source environment
        uses: icedq-tools/export-action@v1
        with:
          icedq-url:       ${{ vars.ICEDQ_BASE_URL }}
          keycloak-url:    ${{ vars.ICEDQ_KEYCLOAK_URL }}
          org-id:          ${{ vars.ICEDQ_ORG_ID }}
          client-id:       ${{ secrets.ICEDQ_CLIENT_ID }}
          client-secret:   ${{ secrets.ICEDQ_CLIENT_SECRET }}
          account-id:      ${{ vars.ICEDQ_ACCOUNT_ID }}
          workspace-id:    ${{ vars.ICEDQ_WORKSPACE_ID }}
          resource:        folder
          id:              ${{ inputs.folder-id }}
          include-child:   true
          output-file:     ./exports/bundle.zip
          artifact-name:   icedq-folder-bundle
          verify-ssl:      ${{ vars.ICEDQ_VERIFY_SSL }}

  generate-folder-mapping:
    runs-on: ubuntu-latest
    needs: export-folder
    environment: TARGET
    timeout-minutes: 30
    steps:
      - name: Download bundle from export job
        uses: actions/download-artifact@v4
        with:
          name: icedq-folder-bundle
          path: ./exports

      - name: Generate mapping for Target environment
        uses: icedq-tools/generate-mapping-action@v1
        with:
          icedq-url:      ${{ vars.ICEDQ_BASE_URL }}
          keycloak-url:   ${{ vars.ICEDQ_KEYCLOAK_URL }}
          org-id:         ${{ vars.ICEDQ_ORG_ID }}
          client-id:      ${{ secrets.ICEDQ_CLIENT_ID }}
          client-secret:  ${{ secrets.ICEDQ_CLIENT_SECRET }}
          account-id:     ${{ vars.ICEDQ_ACCOUNT_ID }}
          workspace-id:   ${{ vars.ICEDQ_WORKSPACE_ID }}
          bundle:         ./exports/bundle.zip
          output-file:    ./mapping/folder-migration-mapping.json
          artifact-name:   icedq-folder-mapping
          verify-ssl:     ${{ vars.ICEDQ_VERIFY_SSL }}

  import-folder:
    runs-on: ubuntu-latest
    needs: [export-folder, generate-folder-mapping]
    environment: TARGET
    timeout-minutes: 30
    steps:
      - name: Download bundle from export job
        uses: actions/download-artifact@v4
        with:
          name: icedq-folder-bundle
          path: ./exports

      - name: Download generated mapping
        uses: actions/download-artifact@v4
        with:
          name: icedq-folder-mapping
          path: ./mapping

      - name: Import folder into Target environment
        uses: icedq-tools/import-action@v1
        with:
          icedq-url:             ${{ vars.ICEDQ_BASE_URL }}
          keycloak-url:          ${{ vars.ICEDQ_KEYCLOAK_URL }}
          org-id:                ${{ vars.ICEDQ_ORG_ID }}
          client-id:             ${{ secrets.ICEDQ_CLIENT_ID }}
          client-secret:         ${{ secrets.ICEDQ_CLIENT_SECRET }}
          account-id:            ${{ vars.ICEDQ_ACCOUNT_ID }}
          workspace-id:          ${{ vars.ICEDQ_WORKSPACE_ID }}
          bundle:                ./exports/bundle.zip
          kind:                  workflows
          mapping-file:          ./mapping/folder-migration-mapping.json
          strict:                false
          terminate-on-conflict: true
          verify-ssl:            ${{ vars.ICEDQ_VERIFY_SSL }}
