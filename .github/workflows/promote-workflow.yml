name: Promote Workflow from Soruce to Target

on:
  workflow_dispatch:
    inputs:
      workflow-id:
        description: "UUID of the workflow to export from Soruce"
        required: true
        default: "REPLACE_WITH_YOUR_WORKFLOW_UUID"

jobs:
  export:
    runs-on: self-hosted
    environment: SOURCE
    outputs:
      task-id:     ${{ steps.export.outputs.task-id }}
      status:      ${{ steps.export.outputs.status }}
      bundle-path: ${{ steps.export.outputs.bundle-path }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Export workflow from Soruce environment
        id: export
        uses: icedq-tools/export-action@main
        with:
          icedq-url:       ${{ vars.ICEDQ_URL }}
          keycloak-url:    ${{ vars.ICEDQ_KEYCLOAK_URL }}
          org-id:          ${{ vars.ICEDQ_ORG_ID }}
          client-id:       ${{ secrets.ICEDQ_CLIENT_ID }}
          client-secret:   ${{ secrets.ICEDQ_CLIENT_SECRET }}
          account-id:      ${{ vars.ICEDQ_ACCOUNT_ID }}
          workspace-id:    ${{ vars.ICEDQ_WORKSPACE_ID }}
          resource:        workflow
          id:              ${{ inputs.workflow-id }}
          include-child:   true
          output-file:     ./exports/bundle.zip
          artifact-name:   icedq-workflow-bundle
          verify-ssl:      ${{ vars.ICEDQ_VERIFY_SSL }}

  import:
    runs-on: ubuntu-latest
    needs: export
    environment: TARGET
    steps:
      - name: Checkout repo (for mapping file)
        uses: actions/checkout@v4

      - name: Download bundle from export job
        uses: actions/download-artifact@v4
        with:
          name: icedq-workflow-bundle
          path: ./exports

      - name: Import workflow into Target environment
        uses: icedq-tools/import-action@main
        with:
          icedq-url:             ${{ vars.ICEDQ_URL }}
          keycloak-url:          ${{ vars.ICEDQ_KEYCLOAK_URL }}
          org-id:                ${{ vars.ICEDQ_ORG_ID }}
          client-id:             ${{ secrets.ICEDQ_CLIENT_ID }}
          client-secret:         ${{ secrets.ICEDQ_CLIENT_SECRET }}
          account-id:            ${{ vars.ICEDQ_ACCOUNT_ID }}
          workspace-id:          ${{ vars.ICEDQ_WORKSPACE_ID }}
          bundle:                ./exports/bundle.zip
          kind:                  workflows
          mapping-file:          ./mappings/workflow-migration-mapping.json
          strict:                false
          terminate-on-conflict: true
          verify-ssl:            ${{ vars.ICEDQ_VERIFY_SSL }}