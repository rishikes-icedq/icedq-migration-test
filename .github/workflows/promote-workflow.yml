name: Promote Workflow from Source to Target

on:
  workflow_dispatch:
    inputs:
      workflow-id:
        description: "UUID of the workflow to export from Source"
        required: true
        default: "REPLACE_WITH_YOUR_WORKFLOW_UUID"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  export-workflow:
    runs-on: ubuntu-latest
    environment: SOURCE
    timeout-minutes: 45
    steps:
      - name: Export workflow from Source environment
        uses: icedq-tools/export-action@v1
        with:
          icedq-url:       ${{ vars.ICEDQ_BASE_URL }}
          keycloak-url:    ${{ vars.ICEDQ_KEYCLOAK_URL }}
          org-id:          ${{ vars.ICEDQ_ORG_ID }}
          client-id:       ${{ secrets.ICEDQ_CLIENT_ID }}
          client-secret:   ${{ secrets.ICEDQ_CLIENT_SECRET }}
          account-id:      ${{ vars.ICEDQ_ACCOUNT_ID }}
          workspace-id:    ${{ vars.ICEDQ_WORKSPACE_ID }}
          resource:        workflow
          id:              ${{ inputs.workflow-id }}
          include-child:   true
          output-file:     ./exports/bundle.zip
          artifact-name:   icedq-workflow-bundle
          verify-ssl:      ${{ vars.ICEDQ_VERIFY_SSL }}

  generate-workflow-mapping:
    runs-on: ubuntu-latest
    needs: export-workflow
    environment: TARGET
    timeout-minutes: 30
    steps:
      - name: Download bundle from export job
        uses: actions/download-artifact@v4
        with:
          name: icedq-workflow-bundle
          path: ./exports

      - name: Generate mapping for Target environment
        uses: icedq-tools/generate-mapping-action@v1
        with:
          icedq-url:      ${{ vars.ICEDQ_BASE_URL }}
          keycloak-url:   ${{ vars.ICEDQ_KEYCLOAK_URL }}
          org-id:         ${{ vars.ICEDQ_ORG_ID }}
          client-id:      ${{ secrets.ICEDQ_CLIENT_ID }}
          client-secret:  ${{ secrets.ICEDQ_CLIENT_SECRET }}
          account-id:     ${{ vars.ICEDQ_ACCOUNT_ID }}
          workspace-id:   ${{ vars.ICEDQ_WORKSPACE_ID }}
          bundle:         ./exports/bundle.zip
          output-file:    ./mapping/workflow-migration-mapping.json
          artifact-name:   icedq-workflow-mapping
          verify-ssl:     ${{ vars.ICEDQ_VERIFY_SSL }}

  import-workflow:
    runs-on: ubuntu-latest
    needs: [export-workflow, generate-workflow-mapping]
    environment: TARGET
    timeout-minutes: 30
    steps:
      - name: Download bundle from export job
        uses: actions/download-artifact@v4
        with:
          name: icedq-workflow-bundle
          path: ./exports

      - name: Download generated mapping
        uses: actions/download-artifact@v4
        with:
          name: icedq-workflow-mapping
          path: ./mapping

      - name: Import workflow into Target environment
        uses: icedq-tools/import-action@v1
        with:
          icedq-url:             ${{ vars.ICEDQ_BASE_URL }}
          keycloak-url:          ${{ vars.ICEDQ_KEYCLOAK_URL }}
          org-id:                ${{ vars.ICEDQ_ORG_ID }}
          client-id:             ${{ secrets.ICEDQ_CLIENT_ID }}
          client-secret:         ${{ secrets.ICEDQ_CLIENT_SECRET }}
          account-id:            ${{ vars.ICEDQ_ACCOUNT_ID }}
          workspace-id:          ${{ vars.ICEDQ_WORKSPACE_ID }}
          bundle:                ./exports/bundle.zip
          kind:                  workflows
          mapping-file:          ./mapping/workflow-migration-mapping.json
          strict:                false
          terminate-on-conflict: true
          verify-ssl:            ${{ vars.ICEDQ_VERIFY_SSL }}
