name: Promote Rule from Soruce to Target

on:
  workflow_dispatch:
    inputs:
      rule-id:
        description: "UUID of the rule to export from Soruce"
        required: true
        default: "REPLACE_WITH_YOUR_RULE_UUID"

jobs:
  export:
    runs-on: self-hosted
    environment: SOURCE
    outputs:
      task-id:     ${{ steps.export.outputs.task-id }}
      status:      ${{ steps.export.outputs.status }}
      bundle-path: ${{ steps.export.outputs.bundle-path }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Export rule from Source environment
        id: export
        uses: icedq-tools/export-action@main
        with:
          icedq-url:       ${{ vars.ICEDQ_URL }}
          keycloak-url:    ${{ vars.ICEDQ_KEYCLOAK_URL }}
          org-id:          ${{ vars.ICEDQ_ORG_ID }}
          client-id:       ${{ secrets.ICEDQ_CLIENT_ID }}
          client-secret:   ${{ secrets.ICEDQ_CLIENT_SECRET }}
          account-id:      ${{ vars.ICEDQ_ACCOUNT_ID }}
          workspace-id:    ${{ vars.ICEDQ_WORKSPACE_ID }}
          resource:        rule
          id:              ${{ inputs.rule-id }}
          output-file:     ./exports/bundle.zip
          artifact-name:   icedq-rule-bundle
          verify-ssl:      ${{ vars.ICEDQ_VERIFY_SSL }}

  generate-mapping:
    runs-on: ubuntu-latest
    needs: export
    environment: TARGET
    outputs:
      mapping-file: ${{ steps.generate.outputs.mapping-file }}
    steps:
      - name: Download bundle from export job
        uses: actions/download-artifact@v4
        with:
          name: icedq-rule-bundle
          path: ./exports

      - name: Generate mapping for Target environment
        id: generate
        uses: icedq-tools/generate-mapping-action@main
        with:
          icedq-url:      ${{ vars.ICEDQ_URL }}
          keycloak-url:   ${{ vars.ICEDQ_KEYCLOAK_URL }}
          org-id:         ${{ vars.ICEDQ_ORG_ID }}
          client-id:      ${{ secrets.ICEDQ_CLIENT_ID }}
          client-secret:  ${{ secrets.ICEDQ_CLIENT_SECRET }}
          account-id:     ${{ vars.ICEDQ_ACCOUNT_ID }}
          workspace-id:   ${{ vars.ICEDQ_WORKSPACE_ID }}
          bundle:         ./exports/bundle.zip
          output-file:    ./mapping/rule-migration-mapping.json
          artifact-name:  icedq-rule-mapping
          verify-ssl:     ${{ vars.ICEDQ_VERIFY_SSL }}

  import:
    runs-on: ubuntu-latest
    needs: [export, generate-mapping]
    environment: TARGET
    steps:
      - name: Download bundle from export job
        uses: actions/download-artifact@v4
        with:
          name: icedq-rule-bundle
          path: ./exports

      - name: Download generated mapping
        uses: actions/download-artifact@v4
        with:
          name: icedq-rule-mapping
          path: ./mapping

      - name: Import rule into Target environment
        uses: icedq-tools/import-action@main
        with:
          icedq-url:             ${{ vars.ICEDQ_URL }}
          keycloak-url:          ${{ vars.ICEDQ_KEYCLOAK_URL }}
          org-id:                ${{ vars.ICEDQ_ORG_ID }}
          client-id:             ${{ secrets.ICEDQ_CLIENT_ID }}
          client-secret:         ${{ secrets.ICEDQ_CLIENT_SECRET }}
          account-id:            ${{ vars.ICEDQ_ACCOUNT_ID }}
          workspace-id:          ${{ vars.ICEDQ_WORKSPACE_ID }}
          bundle:                ./exports/bundle.zip
          kind:                  rules
          mapping-file:          ./mapping/rule-migration-mapping.json
          strict:                false
          terminate-on-conflict: true
          verify-ssl:            ${{ vars.ICEDQ_VERIFY_SSL }}
